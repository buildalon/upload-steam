name: Update Release Tags
on:
  push:
    tags: ['*']
  workflow_dispatch:
jobs:
  update-release-tags:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: RageAgainstThePixel/update-action-release-tags@v1
